<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'NB International Pro', Inter, Arial, sans-serif">
  <title>Round trip: selecting a customer in Forms, saving an order in Vaadin</title>
  <defs>
    <marker id="to-vaadin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#056ff0"/>
    </marker>
    <marker id="to-forms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b2eff"/>
    </marker>
    <marker id="to-db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f0f0f"/>
    </marker>
    <style>
      .head { font-size: 18px; font-weight: 700; fill: #0f0f0f; }
      .head-w { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .life { stroke: #9f9f9f; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .label { font-family: 'NB International Pro Mono', 'Noto Sans Mono', Menlo, monospace; font-size: 14px; fill: #0f0f0f; }
      .note { font-size: 15px; fill: #3f3f3f; }
      .num { font-family: 'NB International Pro Mono', 'Noto Sans Mono', Menlo, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .section { font-family: 'NB International Pro Mono', 'Noto Sans Mono', Menlo, monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; fill: #575757; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f0f4f7"/>

  <!-- Lanes: Forms server 150, Forms client bean 450, Vaadin view 750, Database 1050 -->
  <rect x="50" y="30" width="200" height="54" rx="8" fill="#ffffff" stroke="#878787" stroke-width="1.5"/>
  <text x="150" y="63" class="head" text-anchor="middle">Forms server</text>
  <rect x="350" y="30" width="200" height="54" rx="8" fill="#4b2eff"/>
  <text x="450" y="63" class="head-w" text-anchor="middle">VaadinBean</text>
  <rect x="650" y="30" width="200" height="54" rx="8" fill="#056ff0"/>
  <text x="750" y="63" class="head-w" text-anchor="middle">Vaadin view</text>
  <rect x="950" y="30" width="200" height="54" rx="8" fill="#ffffff" stroke="#0f0f0f" stroke-width="1.5"/>
  <text x="1050" y="63" class="head" text-anchor="middle">Oracle Database</text>

  <line x1="150" y1="84" x2="150" y2="552" class="life"/>
  <line x1="450" y1="84" x2="450" y2="552" class="life"/>
  <line x1="750" y1="84" x2="750" y2="552" class="life"/>
  <line x1="1050" y1="84" x2="1050" y2="552" class="life"/>

  <!-- Forms -> Vaadin -->
  <rect x="30" y="106" width="400" height="26" fill="#f0f4f7"/>
  <text x="40" y="124" class="section">The user moves to a customer in Forms</text>

  <line x1="150" y1="172" x2="446" y2="172" stroke="#056ff0" stroke-width="2.5" marker-end="url(#to-vaadin)"/>
  <circle cx="150" cy="172" r="13" fill="#056ff0"/><text x="150" y="177" class="num" text-anchor="middle">1</text>
  <text x="300" y="160" class="label" text-anchor="middle">SET_CUSTOM_PROPERTY</text>

  <line x1="450" y1="232" x2="746" y2="232" stroke="#056ff0" stroke-width="2.5" marker-end="url(#to-vaadin)"/>
  <circle cx="450" cy="232" r="13" fill="#056ff0"/><text x="450" y="237" class="num" text-anchor="middle">2</text>
  <text x="600" y="220" class="label" text-anchor="middle">showCustomer(id, name)</text>

  <line x1="750" y1="292" x2="1046" y2="292" stroke="#0f0f0f" stroke-width="2" marker-end="url(#to-db)"/>
  <circle cx="750" cy="292" r="13" fill="#0f0f0f"/><text x="750" y="297" class="num" text-anchor="middle">3</text>
  <text x="900" y="280" class="label" text-anchor="middle">SELECT orders</text>

  <!-- Vaadin -> Forms -->
  <rect x="30" y="346" width="440" height="26" fill="#f0f4f7"/>
  <text x="40" y="364" class="section">The user saves an order in a Vaadin Dialog</text>

  <line x1="750" y1="412" x2="1046" y2="412" stroke="#0f0f0f" stroke-width="2" marker-end="url(#to-db)"/>
  <circle cx="750" cy="412" r="13" fill="#0f0f0f"/><text x="750" y="417" class="num" text-anchor="middle">4</text>
  <text x="900" y="400" class="label" text-anchor="middle">UPDATE · COMMIT</text>

  <line x1="750" y1="472" x2="454" y2="472" stroke="#4b2eff" stroke-width="2.5" marker-end="url(#to-forms)"/>
  <circle cx="750" cy="472" r="13" fill="#4b2eff"/><text x="750" y="477" class="num" text-anchor="middle">5</text>
  <text x="600" y="460" class="label" text-anchor="middle">event orderSaved</text>

  <line x1="450" y1="532" x2="154" y2="532" stroke="#4b2eff" stroke-width="2.5" marker-end="url(#to-forms)"/>
  <circle cx="450" cy="532" r="13" fill="#4b2eff"/><text x="450" y="537" class="num" text-anchor="middle">6</text>
  <text x="300" y="520" class="label" text-anchor="middle">custom item event</text>

  <rect x="62" y="566" width="300" height="78" rx="8" fill="#ffffff" stroke="#878787" stroke-width="1.5"/>
  <circle cx="150" cy="566" r="13" fill="#4b2eff"/><text x="150" y="571" class="num" text-anchor="middle">7</text>
  <text x="82" y="602" class="label">WHEN-CUSTOM-ITEM-EVENT</text>
  <text x="82" y="626" class="note">updates the Orders total column</text>

  <rect x="610" y="566" width="520" height="78" rx="8" fill="#ffffff"/>
  <text x="630" y="598" class="note">Each side writes through its own session.</text>
  <text x="630" y="624" class="note">Vaadin notifies Forms only after the commit.</text>
</svg>
